name: Build BlockWay Launcher Windows & Linux

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'google*.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.pkg.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read package.json version
        id: pkg
        shell: pwsh
        run: |
          $v = node -p "require('./package.json').version"
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Install dependencies in GitHub Cloud
        run: npm install

      - name: Build Windows Setup & Portable EXE
        run: npm run dist:win

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BlockWay-Windows-v${{ steps.pkg.outputs.version }}
          path: |
            dist/*.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read package.json version
        id: pkg
        run: |
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Install dependencies in GitHub Cloud
        run: npm install

      - name: Build Linux AppImage & DEB
        run: npm run dist:linux

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BlockWay-Linux-v${{ steps.pkg.outputs.version }}
          path: |
            dist/*.AppImage
            dist/*.deb

  publish-release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows & Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-dist
          merge-multiple: true

      - name: Publish GitHub Release v${{ needs.build-windows.outputs.version }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build-windows.outputs.version }}
          name: "BlockWay Launcher v${{ needs.build-windows.outputs.version }} PRO - Windows & Linux"
          body: |
            ### 📦 BlockWay Launcher v${{ needs.build-windows.outputs.version }} PRO - Every World, One Place (Windows & Linux)
            - **🐧 Hỗ Trợ Đa Nền Tảng Windows (`.exe`) & Linux (`.AppImage` / `.deb`):** Tự động tải Java Runtime (8 / 17 / 21 / 25) và FFmpeg theo đúng hệ điều hành, quét Launcher ngoài chuẩn XDG / Flatpak, hỗ trợ Discord Rich Presence trên Linux và tự bật tăng tốc đa luồng OpenGL (`mesa_glthread=true` / NVIDIA Prime Offload).
            - **⚡ Turbo Smooth Core™ 6 Tầng & Generational ZGC (`< 0.05 ms`):** Tự động tối ưu `options.txt`, `optionsof.txt`, `sodium-options.json` (độ trễ 1-frame), `modernfix-mixins.properties`, `immediatelyfast.json`, gỡ khóa 30 FPS giao diện Exordium và hoàn tác 1-Click.
            - **👤 Menu Nhanh Tài Khoản, Ảnh Avatar Hồ Sơ Riêng & Nhận Diện Khuôn Mặt Skin Thông Minh:** Chuyển nhanh *Cloud • Offline • Microsoft*, tải ảnh đại diện riêng (`.PNG` / `.JPG` / `.WEBP`) không làm đổi Skin 3D trong game.
            - **🔆 Trợ Lý `OptiFine` Đa Nền Tảng & Kho Hạt Giống 16:9:** Chọn tự do mọi phiên bản MC (`1.7.10 → 26.3`) và mọi Mod Loader (`Core OptiFine`, `Fabric`, `Forge`, `NeoForge`, `Quilt`), tích chọn từng tính năng lẻ và tạo Thế giới Seed 16:9 1-Click.
          files: |
            release-dist/*.exe
            release-dist/*.AppImage
            release-dist/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
