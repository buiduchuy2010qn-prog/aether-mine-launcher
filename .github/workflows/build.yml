name: Build BlockWay Launcher Windows EXE

on:
  push:
    branches:
      - main
    # Website / docs-only changes don't need a new Windows build
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'google*.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read package.json version
        id: pkg
        shell: pwsh
        run: |
          $v = node -p "require('./package.json').version"
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Install dependencies in GitHub Cloud
        run: npm install

      - name: Build Windows Setup & Portable EXE
        run: npm run dist:win

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlockWay-Launcher-v${{ steps.pkg.outputs.version }}
          path: |
            dist/*.exe

      - name: Publish GitHub Release v${{ steps.pkg.outputs.version }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.pkg.outputs.version }}
          name: "BlockWay Launcher v${{ steps.pkg.outputs.version }} PRO - Every World, One Place"
          body: |
            ### 🍃 BlockWay Launcher v${{ steps.pkg.outputs.version }} PRO - Every World, One Place
            - **🍃 Chế Độ "Mượt Êm — Không Ép Máy" (bật sẵn):** Tự giới hạn FPS theo tần số màn hình, chỉnh tầm nhìn / mô phỏng hợp lý và nạp RAM nhẹ nhàng — game mượt đều khung hình mà **không vắt kiệt CPU/GPU, máy mát và êm quạt hơn**. Tắt 1-Click là trả lại nguyên cài đặt cũ.
            - **🌐 Servers 2.0:** Ping trực tiếp như trong game (độ trễ thật, MOTD, logo server, phiên bản & cảnh báo lệch bản), **⚡ Vào Thẳng** server 1-Click, **📌 Ghim** server yêu thích và **đồng bộ 2 chiều** với danh sách Multiplayer trong Minecraft.
            - **📥 Kéo-Thả Cài Mọi Thứ:** Thả file Mod `.jar`, Shader / Resource Pack `.zip`, Map `.zip` hoặc Modpack `.mrpack` vào cửa sổ — Launcher tự nhận diện, cài đúng chỗ và bật sẵn.
            - **🧺 Tủ Đồ Skin & 🦸 Áo Choàng Riêng:** Lưu 12 skin gần nhất để mặc lại 1-Click, tải áo choàng `.png` của riêng bạn — bạn bè chơi Offline / LAN cũng thấy.
            - **📤 Chia Sẻ Log Lỗi 1-Click:** Bác Sĩ Crash tạo link nhật ký (mclo.gs) đã tự che tên máy & IP để gửi nhóm hỗ trợ.
            - **🛠️ Sửa Lỗi & Tối Ưu:** Mod đã tắt không còn tự bật lại, sửa thẻ Kho Seed / Kho Map, sửa skin bạn bè trong Modpack, hồi sinh Hardcore an toàn hơn (giữ ngày trong game, tự đưa về điểm hồi sinh nếu rơi Void), sửa ảnh nền từ ảnh chụp, giao diện Sáng / Trắng Hồng rõ chữ hơn, bản Portable tự cập nhật đúng bản Portable.
          files: |
            dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
