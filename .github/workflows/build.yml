name: Build Aether Craft v5.0 Windows EXE

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies in GitHub Cloud
        run: npm install

      - name: Build Portable Windows EXE
        run: npm run dist:win

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AetherCraft-Portable-v5.0
          path: dist/*.exe

      - name: Publish GitHub Release v5.0.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v5.0.0
          name: "Aether Craft v5.0 — 5 Famous Launcher Themes + Smooth-Exit Engine (<0.2s Close) + 3D WebGL"
          body: |
            ### Aether Craft v5.0 — Tối Ưu Tắt Game Siêu Mượt (<0.2s) & 5 Giao Diện Launcher Nổi Tiếng
            1. **Smooth-Exit Engine (Tắt Minecraft Siêu Mượt & Không Treo Máy):**
               - **Dynamic Low-Commit Heap (`-Xms512M` + `G1PeriodicGCInterval=15000`):** Không khóa cứng 4GB RAM ngay từ đầu, tự động trả RAM trống về Windows liên tục khi đang chơi để tránh tràn `pagefile.sys` gây đơ máy lúc tắt game.
               - **Auto-Hibernate Launcher (0% GPU & <20MB RAM khi đang chơi):** Khi cửa sổ Minecraft hiện lên, Launcher tự động tạm dừng vòng lặp 3D WebGL, thu nhỏ và gọi hàm Win32 `EmptyWorkingSet` (`psapi.dll`) giải phóng 95% RAM của Launcher.
               - **Instant Quit Hook (<0.2s):** Ngay khi bạn bấm *Quit Game* trong Minecraft (đã lưu xong thế giới), Engine tự động dọn sạch tiến trình con `javaw.exe` và giải phóng RAM lập tức, không còn cảnh đợi 5–10 giây tắt cửa sổ.
               - **Nút "TẮT NHANH MINE (0.1s)" & "Dọn RAM Ngay":** Tắt cưỡng bức Minecraft bị treo hoặc dọn RAM hệ thống chỉ với 1 cú click.
            2. **5 Giao Diện Launcher Xịn Nhất Thế Giới (Đổi Trực Tiếp 1-Click):**
               - **Lunar Neon (Mặc định):** Kính mờ Glassmorphism đen-xanh ngọc chuẩn Lunar Client.
               - **Modrinth Studio:** Tối giản hiện đại với sắc xanh `#1bd96a` đặc trưng của Modrinth App.
               - **Feather Cyber:** Tím Neon Cyberpunk lấy cảm hứng từ Feather Client & LabyMod 4.
               - **Badlion Esports:** Đen Carbon phối Đỏ-Vàng Gold đậm chất PvP Esports.
               - **Prism Daylight:** Giao diện Sáng pha lê trong trẻo.
            3. **Vào Nhanh Server (Quick-Join Multiplayer):** Click chọn nhanh **LuckyVN, HeroMC, Hypixel, PikaNetwork** hoặc nhập IP bất kỳ để vào thẳng Server khi bấm Chơi Ngay.
          files: dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}