name: Build BlockWay Launcher Windows EXE

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Read package.json version
        id: pkg
        shell: pwsh
        run: |
          $v = node -p "require('./package.json').version"
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Install dependencies in GitHub Cloud
        run: npm install

      - name: Build Windows Setup & Portable EXE
        run: npm run dist:win

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlockWay-Launcher-v${{ steps.pkg.outputs.version }}
          path: |
            dist/*.exe

      - name: Publish GitHub Release v${{ steps.pkg.outputs.version }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.pkg.outputs.version }}
          name: "BlockWay Launcher v${{ steps.pkg.outputs.version }} PRO — Every World, One Place"
          body: |
            ### ⚡ BlockWay Launcher v${{ steps.pkg.outputs.version }} PRO — Every World, One Place
            - **👕 Kho Skin Trực Tuyến Theo Chủ Đề & Đồng Bộ Thấy Đúng Skin Nhau:** Duyệt và mặc 1-Click hàng ngàn mẫu Skin 3D (*Anime, Ngầu, Dễ thương, Hiệp sĩ, YouTuber*) kèm chế độ **Đồng bộ Skin đa người chơi** giúp bạn bè chơi chung Offline / LAN / Phòng mạng đều nhìn thấy đúng Skin & Lớp áo 3D riêng của nhau.
            - **⚔️ Chế Độ Chiến Đấu PvP / BedWars 1-Click (Phong Cách Lunar Client):** Bật 1-Click để tự trang bị **Bảng phím bấm Keystrokes + tốc độ nhấp CPS, Tự chạy nhanh (`ToggleSprint`), Thanh độ bền Giáp & Hiệu ứng Thuốc, Tâm ngắm động, Góc nhìn 360° và Lửa thấp không che màn hình** — tắt 1-Click là trả lại nguyên vẹn bộ Mod sinh tồn.
            - **🛠️ Trình Cứu Hộ Thế Giới Hardcore & Kho Hạt Giống (Seed) Đẹp:** Xem trực tiếp mã **Seed** và **tọa độ nhân vật (`X, Y, Z`)**, mở khóa dùng lệnh, bật giữ đồ khi chết, cứu nhân vật kẹt dưới vực về Điểm xuất hiện, **Hồi sinh khỏi Hardcore 1-Click** và tạo thế giới từ Kho Seed tuyển chọn đẹp nhất.
            - **🎬 Studio Quay Lại Trận Đấu 3D & Xuất Video `.MP4` Tự Động:** Tự cài trình quay phim 3D trong game (**Flashback / ReplayMod**) + **Camera bay tự do (`Freecam`)** kèm bộ kết xuất Video `.MP4` gọn nhẹ để dựng clip điện ảnh đăng TikTok / YouTube mà không gây tụt FPS lúc đang chơi.
            - **🎛️ Hệ Sinh Thái Toàn Diện:** Gỡ trùng phím tắt Modpack & Sáng hang động Fullbright 1-Click, Kho Bản đồ xây sẵn & Datapack, Combo Voice Chat Tổ đội, Cố vấn RAM tự động, Tự động đảo Void OneBlock / SkyBlock và Bác Sĩ Crash Tiếng Việt.
          files: |
            dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
