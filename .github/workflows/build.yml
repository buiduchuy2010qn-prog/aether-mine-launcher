name: Build BlockWay Launcher Windows EXE

on:
  push:
    branches:
      - main
    # Website / docs-only changes don't need a new Windows build
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'google*.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read package.json version
        id: pkg
        shell: pwsh
        run: |
          $v = node -p "require('./package.json').version"
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Install dependencies in GitHub Cloud
        run: npm install

      - name: Build Windows Setup & Portable EXE
        run: npm run dist:win

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlockWay-Launcher-v${{ steps.pkg.outputs.version }}
          path: |
            dist/*.exe

      - name: Publish GitHub Release v${{ steps.pkg.outputs.version }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.pkg.outputs.version }}
          name: "BlockWay Launcher v${{ steps.pkg.outputs.version }} PRO - Every World, One Place"
          body: |
            ### 📦 BlockWay Launcher v${{ steps.pkg.outputs.version }} PRO - Every World, One Place
            - **🔎 Hiển Thị Sắc Nét Chuẩn Màn Hình Laptop & Nút `Aa` Chỉnh Cỡ Chữ (90%–125%):** Khắc phục triệt để lỗi tự thu nhỏ giao diện trên màn hình Laptop DPI 125%–150%, làm mới bố cục tab Cài Đặt không còn khoảng trống thừa, nâng cấp toàn bộ ô tích (Checkbox) to rõ sắc nét kèm phím tắt `Ctrl ± / 0`.
            - **📦 Đóng Gói & Gửi Bộ Mod Cho Bạn Bè 2.0:** Nút **📦 Đóng gói gửi bạn** rõ ràng tại tab Mod & Pack và trên từng Modpack đã cài; tùy chọn đóng gói Mod, Shader & Resource Pack, Config tinh chỉnh, Phím tắt (mặc định tắt `servers.dat` để giữ riêng tư IP máy chủ), tự mở thư mục chứa tệp `.mrpack` để kéo gửi thẳng qua Zalo / Discord.
            - **🔆 Core `OptiFine` Trực Tiếp Tại Trang Chủ & Chơi Game (1-Click):** Chọn ngay thẻ **OptiFine (Shader • Zoom)** trong mục *Chọn mod loader (Core)* rồi bấm **CHƠI NGAY** — tự động kích hoạt cấu hình OptiFine `.jar` gốc (nếu đã cài) hoặc tự trang bị trọn bộ Shader, phím Zoom, Đuốc phát sáng, Kính nối liền & FPS mượt trên mọi phiên bản Minecraft (`1.8` → `1.21.11` → `26.2+`).
            - **📚 Kho Modpack Thông Minh 2.0 & 🍃 Mượt Êm Không Ép Máy:** Ưu tiên gói `1.20.x` / `1.21+` phổ biến, dịch Tiếng Việt mượt mà, khóa FPS êm máy theo màn hình, Servers 2.0 ping thật & vào thẳng 1-Click.
          files: |
            dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
