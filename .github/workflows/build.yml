name: Build BlockWay Launcher Windows EXE

on:
  push:
    branches:
      - main
    # Website / docs-only changes don't need a new Windows build
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'google*.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read package.json version
        id: pkg
        shell: pwsh
        run: |
          $v = node -p "require('./package.json').version"
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Install dependencies in GitHub Cloud
        run: npm install

      - name: Build Windows Setup & Portable EXE
        run: npm run dist:win

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlockWay-Launcher-v${{ steps.pkg.outputs.version }}
          path: |
            dist/*.exe

      - name: Publish GitHub Release v${{ steps.pkg.outputs.version }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.pkg.outputs.version }}
          name: "BlockWay Launcher v${{ steps.pkg.outputs.version }} PRO - Every World, One Place"
          body: |
            ### 📦 BlockWay Launcher v${{ steps.pkg.outputs.version }} PRO - Every World, One Place
            - **🖼️ Ảnh Bản Đồ 16:9 Cho Kho Hạt Giống (Seed Đẹp) & Kho Bản Đồ / Datapack:** Toàn bộ 8 Seed tuyển chọn hiển thị ảnh phong cảnh 16:9 sắc nét, phóng to xem chi tiết 1-Click, xem trước trực tiếp trong hộp thoại *Tạo Thế Giới Mới* và tự gắn ảnh đại diện (`icon.png` + ảnh bìa rộng) vào `.minecraft/saves` ngay khi tạo Map.
            - **🔆 Core `OptiFine` Tương Thích Trực Tiếp Kho Mod & Shader (1-Click):** Chọn ngay thẻ **OptiFine (Shader • Zoom)** trong mục *Chọn mod loader (Core)* — tự động trang bị trọn bộ Shader, phím Zoom, Đuốc phát sáng, Kính nối liền & FPS mượt, đồng thời **nhận diện tương thích trực tiếp toàn bộ kho Mod Fabric/Forge trong mục Mod & Pack** mà không cần đổi Core.
            - **🔎 Hiển Thị Sắc Nét Chuẩn Màn Hình Laptop & Nút `Aa` Chỉnh Cỡ Chữ (90%–125%):** Khắc phục triệt để lỗi tự thu nhỏ giao diện trên màn hình Laptop DPI 125%–150%, làm mới bố cục tab Cài Đặt không còn khoảng trống thừa, nâng cấp toàn bộ ô tích (Checkbox) to rõ sắc nét kèm phím tắt `Ctrl ± / 0`.
            - **📦 Đóng Gói & Gửi Bộ Mod Cho Bạn Bè 2.0 & 🍃 Mượt Êm Không Ép Máy:** Xuất gói `.mrpack` gửi qua Zalo/Discord 1-Click, Kho Modpack Thông Minh 2.0 dịch Tiếng Việt mượt mà, khóa FPS êm máy theo màn hình, Servers 2.0 ping thật & vào thẳng.
          files: |
            dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
