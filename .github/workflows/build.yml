name: Build BlockWay Launcher Windows EXE

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Read package.json version
        id: pkg
        shell: pwsh
        run: |
          $v = node -p "require('./package.json').version"
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Install dependencies in GitHub Cloud
        run: npm install

      - name: Build Windows Setup & Portable EXE
        run: npm run dist:win

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlockWay-Launcher-v${{ steps.pkg.outputs.version }}
          path: dist/*.exe

      - name: Publish GitHub Release v${{ steps.pkg.outputs.version }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.pkg.outputs.version }}
          name: "BlockWay Launcher v${{ steps.pkg.outputs.version }} PRO — Every World, One Place"
          body: |
            ### ⚡ BlockWay Launcher v${{ steps.pkg.outputs.version }} PRO — Every World, One Place
            - **Giao diện Dashboard v33.0 PRO:** Bố cục Bento trực quan, 6 chủ đề màu sắc (BlockWay Navy, Trắng Sáng, Mojang, Modrinth, Feather, Cherry) và tự động thu phóng theo tỉ lệ cửa sổ.
            - **Đồng bộ & Tự động phát hiện bản cập nhật GitHub:** Thông báo ngay khi có bản mới và cho phép người dùng chủ động nhấn **Cập Nhật Ngay** với cơ chế tải nguyên tử an toàn.
            - **Hệ thống Tài khoản Đám mây 24/7 (Supabase PostgreSQL + Gmail OTP 6 số) & Bảo mật Zero-Trust RPC / CSP.**
            - **Hỗ trợ 5 Core Mod Loaders (`Vanilla`, `Fabric`, `Forge`, `Quilt`, `Legacy Fabric`) & Kho 77,600+ Mods / Shaders Modrinth.**
          files: dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
