name: Build Aether Craft v7.0 Windows EXE

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies in GitHub Cloud
        run: npm install

      - name: Build Windows Setup & Portable EXE
        run: npm run dist:win

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AetherCraft-v7.0
          path: dist/*.exe

      - name: Publish GitHub Release v7.0.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v7.0.0
          name: "Aether Craft v7.0 — Mục Chọn Core & Phiên Bản Trực Tiếp Chuẩn Launcher (Không Gợi Ý Rối Mắt)"
          body: |
            ### Aether Craft v7.0 — Giao Diện Chọn Core & Phiên Bản Trực Tiếp (Không Có Thẻ Gợi Ý Rối Mắt)
            - **Loại bỏ hoàn toàn các thẻ gợi ý dựng sẵn** ở thanh bên và màn hình chính.
            - **Mục Chọn Core & Phiên Bản Trực Tiếp Ngay Tại Màn Hình Chính & Thanh Đáy:**
              - Chọn trực tiếp **5 Core Mod Loaders:** `Vanilla (Gốc)`, `Fabric`, `Forge`, `Quilt`, `Legacy Fabric`.
              - Chọn trực tiếp **Phiên bản Minecraft** từ danh sách đầy đủ (`1.21.4` xuống `1.0`, có lọc `Release`, `Snapshot`, `Beta/Alpha` và ô tìm kiếm nhanh phiên bản).
              - Chọn trực tiếp **Phiên bản Build của Core Loader** tương ứng với bản Minecraft đã chọn.
            - **Bộ cài `AetherCraft-Setup-7.0.0.exe`** tạo Shortcut Desktop & Taskbar cố định không bao giờ lỗi mất file khi đóng mở lại.
          files: dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}