name: Build BlockWay Launcher Windows EXE

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Read package.json version
        id: pkg
        shell: pwsh
        run: |
          $v = node -p "require('./package.json').version"
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Install dependencies in GitHub Cloud
        run: npm install

      - name: Build Windows Setup & Portable EXE
        run: npm run dist:win

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlockWay-Launcher-v${{ steps.pkg.outputs.version }}
          path: |
            dist/*.exe

      - name: Publish GitHub Release v${{ steps.pkg.outputs.version }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.pkg.outputs.version }}
          name: "BlockWay Launcher v${{ steps.pkg.outputs.version }} PRO — Every World, One Place"
          body: |
            ### ⚡ BlockWay Launcher v${{ steps.pkg.outputs.version }} PRO — Every World, One Place
            - **🎛️ Trình Gỡ Trùng Phím Tắt Modpack & Tinh Chỉnh Ngoài Game:** Quét phát hiện toàn bộ phím bị đè nhau trong các gói nhiều Mod, gỡ trùng tự động 1-Click, chỉnh sẵn góc nhìn FOV, âm lượng, độ nhạy chuột, giới hạn FPS, khoảng cách nhìn và **Bật Sáng Trong Hang (`Fullbright`)** ngay ngoài Launcher trước khi mở game.
            - **🔄 Cập Nhật Mod / Shader / Gói Tài Nguyên 1-Click & Hoàn Tác An Toàn:** Tự dò bản cập nhật mới nhất đúng phiên bản Minecraft & Loader cho toàn bộ file đang cài, nâng cấp hàng loạt 1-Click và giữ bản dự phòng để **Hoàn tác 1-Click** ngay nếu bản mới không hợp ý.
            - **🗺️ Kho Bản Đồ Xây Sẵn & Datapack 1-Click:** Duyệt và tải trực tiếp hàng ngàn Map Phiêu lưu, Parkour, Giải đố, Kinh dị, SkyBlock/OneBlock và Datapack sinh tồn — tự giải nén thẳng vào Thế giới hoặc tạo Thế giới mới gắn sẵn Datapack chỉ với 1 cú nhấp.
            - **🎙️ Tổ Đội Sinh Tồn & Đàm Thoại Trong Game (`Co-op Voice & Team Pack`):** Tự động trang bị bộ **Đàm thoại khoảng cách gần trong game (`Simple Voice Chat`)** và **Tổ đội sinh tồn** (chia sẻ bản đồ, đánh dấu tọa độ, xem ba lô, hồi sinh đồng đội) cho cả chủ phòng lẫn bạn bè khi mở phòng chơi chung.
            - **📊 Cố Vấn RAM Tự Động & Chống Giật Khựng Thông Minh:** Tự động tính toán mức RAM chuẩn xác nhất theo dung lượng máy, số lượng Mod và Shader đang bật kèm bộ tham số khởi chạy thế hệ mới giúp triệt tiêu hiện tượng khựng hình khi tải vùng đất mới.
            - **🌍 Tạo Thế Giới & Vào Thẳng 1-Click (`1.20 → 26.x`):** Gói Modpack chưa có thế giới bấm **▶ Chơi** là tự tạo đảo khoảng không / thế giới chuẩn kiểu của gói và vào thẳng game không cần qua menu.
          files: |
            dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
